name: Preparar AAB para Google Play

on:
  workflow_run:
    workflows: ['Seguridad Flutter (SAST y DAST)']
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: aab-produccion
  cancel-in-progress: false

jobs:
  compilar:
    name: AAB firmado de producción
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      API_BASE_URL: https://prybinaback.onrender.com
      REQUIRE_UPLOAD_SIGNING: 'true'
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - name: Definir código de versión y credencial temporal
        shell: bash
        run: |
          set -euo pipefail
          # Cada intento produce un código nuevo, incluso al reintentar una subida.
          test "$GITHUB_RUN_ATTEMPT" -lt 1000
          echo "BUILD_NUMBER=$((GITHUB_RUN_NUMBER * 1000 + GITHUB_RUN_ATTEMPT))" >> "$GITHUB_ENV"
          echo "PLAY_CREDENTIALS_PATH=$RUNNER_TEMP/google-play-service-account.json" >> "$GITHUB_ENV"
      - name: Validar credencial de Google Play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib
          raw = os.environ.get('PLAY_SERVICE_ACCOUNT_JSON', '')
          try:
              data = json.loads(raw)
              assert data.get('type') == 'service_account'
              assert all(data.get(key) for key in ('client_email', 'private_key', 'token_uri'))
          except (ValueError, AssertionError, AttributeError):
              raise SystemExit('::error::Configura GOOGLE_PLAY_SERVICE_ACCOUNT_JSON con el JSON completo de la cuenta de servicio.') from None
          path = pathlib.Path(os.environ['PLAY_CREDENTIALS_PATH'])
          path.touch(mode=0o600)
          path.write_text(raw)
          PYTHON
      - name: Definir ruta temporal de firma
        run: echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/panamericana-upload.jks" >> "$GITHUB_ENV"
      - name: Comprobar validación del mismo commit de master
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method GET "repos/$GH_REPO/actions/workflows/security.yml/runs" \
            -f branch=master -f event=push -f head_sha="$SOURCE_SHA" -f status=success \
            --jq '.workflow_runs | length > 0' | grep -qx true
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Preparar clave de carga
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_KEYSTORE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta el secreto $name. Consulta .github/PUBLICACION_ANDROID.md."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"
      - run: flutter pub get --enforce-lockfile
      - name: Compilar AAB ofuscado para producción
        run: >-
          flutter build appbundle --release --obfuscate
          --split-debug-info=build/symbols
          --build-number="$BUILD_NUMBER"
          --dart-define="API_BASE_URL=$API_BASE_URL"
      - name: Verificar firma y símbolos
        shell: bash
        run: |
          set -euo pipefail
          bundle=build/app/outputs/bundle/release/app-release.aab
          test -s "$bundle"
          test -n "$(find build/symbols -type f -name 'app.*.symbols' -size +0c -print -quit)"
          # Comparar el certificado del AAB con el de la clave de carga.
          keytool -exportcert -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" \
            -file "$RUNNER_TEMP/upload.der"
          keytool -printcert -jarfile "$bundle" -rfc > "$RUNNER_TEMP/bundle.pem"
          openssl x509 -in "$RUNNER_TEMP/bundle.pem" -outform DER -out "$RUNNER_TEMP/bundle.der"
          cmp "$RUNNER_TEMP/upload.der" "$RUNNER_TEMP/bundle.der"
          jarsigner -verify "$bundle"
          mkdir -p build/publicacion
          printf 'commit=%s\nversionCode=%s\napi=%s\n' \
            "$SOURCE_SHA" "$BUILD_NUMBER" "$API_BASE_URL" > build/publicacion/compilacion.txt
      - name: Guardar AAB y símbolos de publicación
        uses: actions/upload-artifact@v4
        with:
          name: google-play-${{ env.SOURCE_SHA }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/symbols/*.symbols
            build/app/outputs/mapping/release/mapping.txt
            build/publicacion/compilacion.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publicar versión en prueba interna de Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJson: ${{ env.PLAY_CREDENTIALS_PATH }}
          packageName: com.panamericana.panamericana_flutter
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
          releaseName: Panamericana Clientes ${{ env.BUILD_NUMBER }}
          mappingFile: build/app/outputs/mapping/release/mapping.txt
          whatsNewDirectory: distribution/whatsnew
      - name: Eliminar claves temporales
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/panamericana-upload.jks" "$RUNNER_TEMP/upload.der" "$RUNNER_TEMP/bundle.pem" "$RUNNER_TEMP/bundle.der" "$RUNNER_TEMP/google-play-service-account.json"
